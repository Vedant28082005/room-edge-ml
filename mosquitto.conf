# Local Mosquitto broker for the room-edge-ml project.
# Run:  mosquitto -c mosquitto.conf -v
#   1883 = plain MQTT  (ESP32 connects here)
#   9001 = MQTT over WebSockets (browser dashboard connects here)
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence false
